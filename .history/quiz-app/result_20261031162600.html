<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Your Name">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/result.css">
  <title>Your result | Interactive Quiz App</title>
  <meta name="description" content="See your quiz score and your best score.">
</head>

<body data-page="result">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <header class="site-header">
    <a class="brand" href="index.html" data-nav><span class="logo" aria-hidden="true">?</span> Interactive Quiz App</a>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark mode"
      aria-pressed="false">&#9790;</button>
  </header>
  <main id="main" class="result-wrap">
    <section class="card result-card" aria-labelledby="congrats">
      <h1 id="congrats">Congratulations!</h1>
      <p class="label">Your Score</p>
      <p class="score" id="score">0 / 10</p>
      <p class="pct" id="pct">0%</p>
      <p class="pts">Points: <strong id="points">0</strong></p>
      <p class="msg" id="msg" role="status"></p>
      <p class="best">Best Score: <strong id="best">0 pts</strong></p>
      <h2 class="top-title">Top 5</h2>
      <ol id="top" class="top"></ol>
      <div class="result-btns">
        <a class="btn btn-primary" href="quiz.html" data-nav>Restart Quiz</a>
        <a class="btn btn-ghost" href="index.html" data-nav>Back to Home</a>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 Interactive Quiz App &middot; Academic project built with HTML, CSS and JavaScript</p>
  </footer>
  <script src="js/app.js"></script>
</body>

</html>
