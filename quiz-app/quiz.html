<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Your Name">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
  <title>Quiz | Interactive Quiz App</title>
  <meta name="description" content="Answer web development questions and see instant feedback.">
</head>

<body data-page="quiz">
  <header class="site-header">
    <a class="brand" href="index.html" data-nav><span class="logo" aria-hidden="true">?</span> Interactive Quiz App</a>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark mode"
      aria-pressed="false">&#9790;</button>
  </header>
  <main id="main" class="quiz-wrap">
    <section class="card quiz-card" aria-labelledby="question">
      <div class="quiz-top">
        <p id="counter" class="counter" aria-live="polite">Question 1 / 10</p>
        <p class="counter"><span id="live">0</span> pts</p>
        <p class="timer" aria-label="Time left"><span id="timer">20</span>s</p>
      </div>
      <div class="progress-row">
        <div class="progress" id="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0"
          aria-valuemax="100" aria-valuenow="0">
          <div class="bar" id="bar"></div>
        </div>
        <span id="percent" class="percent">0%</span>
      </div>
      <h1 id="question" class="question" tabindex="-1"></h1>
      <div id="answers" class="answers" role="group" aria-labelledby="question"></div>
      <p id="feedback" class="feedback" role="status" aria-live="assertive"></p>
      <div class="nav-btns">
        <button class="btn btn-ghost" id="prev" type="button">Previous</button>
        <button class="btn btn-primary" id="next" type="button" disabled>Next</button>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 Interactive Quiz App &middot; Academic project built with HTML, CSS and JavaScript</p>
  </footer>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
</body>

</html>
